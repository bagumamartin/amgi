[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amgi-mcp"
version = "1.0.1"
description = "Amgi MCP server — Python shim for uvx. Launches the bundled Amgi helper."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [{ name = "Amgi" }]
keywords = ["anki", "mcp", "amgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.scripts]
amgi-mcp = "amgi_mcp:main"

[project.urls]
Homepage = "https://github.com/bagumamartin/amgi"
Repository = "https://github.com/bagumamartin/amgi"

[tool.hatch.build.targets.wheel]
packages = ["src/amgi_mcp"]
