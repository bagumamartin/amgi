[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ijuka-mcp"
version = "1.2.0"
description = "Ijuka MCP server — Python shim for uvx. Launches the bundled Ijuka helper."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [{ name = "Ijuka" }]
keywords = ["anki", "mcp", "ijuka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.scripts]
ijuka-mcp = "ijuka_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ijuka_mcp"]
