[package]
name = "anki-bridge-ios"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Dynamic: the xcframework ships AnkiRustLib.framework per slice, and
# package-target previews (XCPreviewAgent, no app host) can only resolve
# the anki_* FFI symbols from a dylib. Do not switch back to staticlib.
crate-type = ["cdylib"]

[dependencies]
anki = { path = "../anki-upstream/rslib", features = ["rustls"] }
anki_proto = { path = "../anki-upstream/rslib/proto" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"     # Optimize for size (iOS binary)
lto = true
strip = true
