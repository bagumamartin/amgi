name: AmgiApp
options:
  bundleIdPrefix: com.bagumamartin
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  defaultSourceDirectoryType: syncedFolder
  # Nest the Resources/* folder references under a single "Resources" group in
  # the navigator instead of scattering them at the project root. Each entry
  # below stays a `type: folder` reference at its original path, so the bundle
  # layout is unchanged — only the Xcode group tree is tidied.
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Must match the SPM packages: NonisolatedNonsendingByDefault changes the
    # mangling of `nonisolated async` function types, so the app target has to
    # opt in too or async @DependencyClient closures fail to link across the
    # package ↔ app boundary. Keep in lockstep with the package manifests.
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Build perf: CAS-backed compilation caching. The CAS path and explicit
    # modules are already configured by Xcode; this turns the cache on so
    # unchanged inputs are served from it. Measured here: warm-cache clean
    # builds 50.9s → 25.8s (−49%); the cache persists in shared DerivedData so
    # this is the steady state (branch switches / Clean Build Folder). One-time
    # cost: first cold build is ~20s slower while the CAS populates. No
    # incremental-build change. See .build-benchmark/optimization-plan.md.
    COMPILATION_CACHE_ENABLE_CACHING: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: YES
    # Shared App Group container ID. Used by the app/widget entitlements via
    # $(APP_GROUP_IDENTIFIER) and mirrored by the runtime constant
    # `AppGroup.identifier` in AmgiTheme. Keep the two in sync.
    #
    # iOS requires IDs to start with `group.` (Apple's signing server rejects
    # anything else). macOS's containermanagerd, however, only lets a sandboxed
    # process access a group container whose ID is prefixed with the requestor's
    # Team ID when the provisioning profile doesn't list the ID explicitly —
    # which is exactly why the widget extension was denied (its profile only
    # carries the `39557WW39R.*` wildcard) and fell back to the empty snapshot.
    # So the base ID is the iOS form, and the macOS SDK override switches to
    # the Team-ID-prefixed form (covered by that same wildcard).
    APP_GROUP_IDENTIFIER: group.com.bagumamartin.AmgiApp
    "APP_GROUP_IDENTIFIER[sdk=macosx*]": 39557WW39R.group.com.bagumamartin.AmgiApp
  configs:
    Debug:
      # Eager linking: let downstream targets link against generated stubs
      # before upstream linking completes, trimming the serial link tail of
      # this multi-module graph. Low-risk experiment — verify clean builds
      # still succeed and re-benchmark for the (small, uncertain) delta.
      EAGER_LINKING: YES
    Release:
      # Release-config hygiene only — NO effect on Debug iteration build time.
      GCC_OPTIMIZATION_LEVEL: s
      ONLY_ACTIVE_ARCH: NO
      ENABLE_TESTABILITY: NO
packages:
  AnkiBridge:
    path: ..
  AmgiUI:
    path: ../AmgiUI
  AmgiReader:
    path: ../AmgiReader
  AmgiIcons:
    path: ../AmgiIcons
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.0.0
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.0.0
  # amgi-mcp helper (embedded into the Mac app bundle)
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.0.0
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.0
schemes:
  AmgiApp:
    build:
      targets:
        AmgiApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmgiAppTests
  AmgiWatchApp:
    build:
      targets:
        AmgiWatchApp: all
    run:
      config: Debug
targets:
  AmgiApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        type: group
        excludes:
          - "Widgets"
          - "Watch"
      - path: Resources/MCEmojiPicker.bundle
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/mathjax
        type: folder
      - path: Resources/Review
        type: folder
      - path: Resources/Fonts
        type: folder
      - path: Resources/EPUBReader
        type: folder
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AnkiBridge
        product: AnkiServices
      - package: AnkiBridge
        product: AnkiClients
      - package: AnkiBridge
        product: AnkiSync
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AmgiCardWeb
      - package: AmgiReader
        product: AmgiReader
      - package: AmgiReader
        product: AmgiReaderDictionary
      - package: AmgiUI
        product: AmgiTheme
      - package: AmgiUI
        product: AmgiUI
      - package: AmgiIcons
        product: AmgiIcons
      - package: swift-navigation
        product: SwiftNavigation
      - package: swift-navigation
        product: SwiftUINavigation
      - package: swift-sharing
        product: Sharing
      - sdk: WidgetKit.framework
        destinationFilters: [iOS, macOS]
      - target: AmgiWidget
        embed: true
        destinationFilters: [iOS, macOS]
      # iOS-only emoji picker (vendored upstream sources, Swift 5 target).
      - target: MCEmojiPicker
        destinationFilters: [iOS]
      # MCP helper: built from the same sources as the AnkiBridge
      # `amgi-mcp` executable product and embedded at
      # Contents/Helpers/amgi-mcp (see postBuildScripts below) so end
      # users get the agent server by simply installing the app.
      - target: AmgiMCPHelper
        embed: false
        link: false
        destinationFilters: [macOS]
    postBuildScripts:
      # Embed the MCP helper into Contents/Helpers. Declared input/output
      # keeps this compatible with ENABLE_USER_SCRIPT_SANDBOXING; the
      # helper lives in BUILT_PRODUCTS_DIR for normal builds and
      # UNINSTALLED_PRODUCTS_DIR (or InstallationBuildProductsLocation)
      # for Archive (SKIP_INSTALL=YES).
      - name: Embed MCP Helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/amgi-mcp
          - $(UNINSTALLED_PRODUCTS_DIR)/amgi-mcp
          - $(UNINSTALLED_PRODUCTS_DIR)/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp
          - $(INSTALL_DIR)/amgi-mcp
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/amgi-mcp
        script: |
          set -e
          INPUT=""
          if [ -f "$BUILT_PRODUCTS_DIR/amgi-mcp" ]; then
            INPUT="$BUILT_PRODUCTS_DIR/amgi-mcp"
          elif [ -f "$UNINSTALLED_PRODUCTS_DIR/amgi-mcp" ]; then
            INPUT="$UNINSTALLED_PRODUCTS_DIR/amgi-mcp"
          elif [ -f "$UNINSTALLED_PRODUCTS_DIR/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp" ]; then
            INPUT="$UNINSTALLED_PRODUCTS_DIR/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp"
          elif [ -f "$INSTALL_DIR/amgi-mcp" ]; then
            INPUT="$INSTALL_DIR/amgi-mcp"
          else
            echo "amgi-mcp absent for this destination — skipping embed"
            exit 0
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          # Plain cp (not ditto): the user-script sandbox denies
          # ditto's temp-file + rename pattern inside the bundle.
          cp -p "$INPUT" "$SCRIPT_OUTPUT_FILE_0"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp
        SWIFT_ENABLE_EXPLICIT_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: AmgiApp.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AmgiApp-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        DEVELOPMENT_TEAM: 39557WW39R
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cxx interop chain. The app imports AmgiReaderDictionary, which
        # is built with .interoperabilityMode(.Cxx) for the hoshidicts
        # bridge. Xcode + SPM under Swift 6 needs an explicit Clang C++
        # standard alongside SWIFT_CXX_INTEROPERABILITY_MODE — without
        # the language-standard hint Clang's dependency scanner rejects
        # the CHoshiDicts modulemap's `requires cplusplus`.
        # The OTHER_SWIFT_FLAGS copy of the same switch looks redundant
        # but is required: the build setting alone doesn't reach the
        # dependency scanner (verified 2026-07: removing it fails with
        # "module 'CHoshiDicts' requires feature 'cplusplus'").
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_SWIFT_FLAGS: "$(inherited) -cxx-interoperability-mode=default"

  # Vendored izyumkin/MCEmojiPicker 1.2.5 (iOS-only upstream). Kept as its
  # own Swift 5 static-library target because the sources predate strict
  # concurrency and can't compile under the app's Swift 6 mode. The emoji
  # definition JSONs ship via Resources/MCEmojiPicker.bundle — the vendor's
  # CocoaPods-style Bundle.module shim locates them by that name.
  MCEmojiPicker:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/MCEmojiPicker
        excludes:
          - "Resources"
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: ""

  # MCP helper executable. Compiles Sources/AmgiMCP (shared with the
  # AnkiBridge package's `amgi-mcp` product) as a first-class Xcode
  # target so the app embeds it without external build steps.
  AmgiMCPHelper:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/AmgiMCP
        type: group
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AnkiProtoBridge
      - package: swift-sdk
        product: MCP
      - package: swift-log
        product: Logging
      - package: swift-protobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_NAME: amgi-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.helper
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        # Keep in lockstep with Package.swift's sharedSwiftSettings —
        # NonisolatedNonsendingByDefault changes async function-type
        # mangling across the package ↔ target link boundary.
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault"
        SWIFT_ENABLE_EXPLICIT_MODULES: YES
        COMPILATION_CACHE_ENABLE_CACHING: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 39557WW39R

  AmgiWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/WidgetSnapshotStore.swift
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AmgiUI
        product: AmgiTheme
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.widget
        INFOPLIST_FILE: Sources/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AmgiWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        DEVELOPMENT_TEAM: 39557WW39R

  AmgiWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
        type: group
      - path: Sources/Shared
        type: group
        excludes:
          - ShareSheet.swift
          - CardContextMenu.swift
          - TagsView.swift
          # App-launch collection-open recovery — macOS/iOS only (the watch
          # never opens the collection and doesn't link AnkiBackend).
          - CollectionLaunchState.swift
          - CollectionBusyView.swift
      # Review engine only — the WebKit host, flip chrome, and render-mode UI
      # are iOS-only; the watch renders stripped text via ReviewSession.
      - path: Sources/Review/ReviewSession.swift
      - path: Sources/Review/ReviewAudioSession.swift
      - path: Sources/Review/RenderEngine/TemplateRenderOverrides.swift
      - path: Sources/Settings/ReviewPreferences.swift
      - path: Sources/Stats/PeriodPicker.swift
      - path: Sources/Stats/TodayStatsCard.swift
      - path: Sources/Stats/FutureDueChart.swift
      - path: Sources/Stats/ReviewsChart.swift
      - path: Sources/Stats/CardCountsChart.swift
      - path: Sources/Stats/IntervalsChart.swift
      - path: Sources/Stats/EaseChart.swift
      - path: Sources/Stats/HourlyChart.swift
      - path: Sources/Stats/ButtonsChart.swift
      - path: Sources/Stats/AddedChart.swift
      - path: Sources/Stats/RetentionChart.swift
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AmgiUI
        product: AmgiTheme
      - package: AmgiUI
        product: AmgiUI
      - package: AnkiBridge
        product: AnkiServices
      - package: AnkiBridge
        product: AnkiClients
      - package: AnkiBridge
        product: AnkiSync
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AmgiCardWeb
      - package: swift-navigation
        product: SwiftNavigation
      - package: swift-sharing
        product: Sharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.bagumamartin.AmgiApp

  AmgiAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/AmgiAppTests
    dependencies:
      - target: AmgiApp
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AmgiApp.app/AmgiApp
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiAppTests
        GENERATE_INFOPLIST_FILE: YES
        # Tests inherit @testable AmgiApp's transitive Cxx-mode import
        # of AmgiReaderDictionary, so they need the same Clang+Swift
        # interop flags as the app target (incl. the OTHER_SWIFT_FLAGS
        # copy — see the app target's comment).
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_SWIFT_FLAGS: "$(inherited) -cxx-interoperability-mode=default"
