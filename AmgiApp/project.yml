name: AmgiApp
options:
  bundleIdPrefix: com.bagumamartin
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  defaultSourceDirectoryType: syncedFolder
  # Nest the Resources/* folder references under a single "Resources" group in
  # the navigator instead of scattering them at the project root. Each entry
  # below stays a `type: folder` reference at its original path, so the bundle
  # layout is unchanged — only the Xcode group tree is tidied.
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 6
    SWIFT_STRICT_CONCURRENCY: complete
    # Must match the SPM packages: NonisolatedNonsendingByDefault changes the
    # mangling of `nonisolated async` function types, so the app target has to
    # opt in too or async @DependencyClient closures fail to link across the
    # package ↔ app boundary. Keep in lockstep with the package manifests.
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Personal Team cannot ship Enhanced Security's hardened-process
    # entitlement keys. Keep pointer auth off: AnkiRustLib has no arm64e slice.
    ENABLE_ENHANCED_SECURITY: NO
    ENABLE_POINTER_AUTHENTICATION: NO
    EXCLUDED_ARCHS[sdk=iphoneos*]: arm64e
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Build perf: CAS-backed compilation caching. The CAS path and explicit
    # modules are already configured by Xcode; this turns the cache on so
    # unchanged inputs are served from it. Measured here: warm-cache clean
    # builds 50.9s → 25.8s (−49%); the cache persists in shared DerivedData so
    # this is the steady state (branch switches / Clean Build Folder). One-time
    # cost: first cold build is ~20s slower while the CAS populates. No
    # incremental-build change. See .build-benchmark/optimization-plan.md.
    COMPILATION_CACHE_ENABLE_CACHING: YES
    # The two "swift compiler caching requires explicit module build" warnings
    # (targets AmgiApp and AmgiReaderDictionary) are expected and unfixable
    # here: swift-build force-disables explicit modules — and therefore
    # caching — for any target in the Cxx-interop chain, i.e. one whose
    # OTHER_SWIFT_FLAGS mention -cxx-interoperability-mode or whose
    # SWIFT_OBJC_INTEROP_MODE is objcxx (rdar://122829880, see
    # SwiftCompiler.swift:swiftExplicitModuleBuildEnabled). The underscored
    # _SWIFT_EXPLICIT_MODULES_ALLOW_CXX_INTEROP=YES escape hatch does silence
    # them, but the build then fails scanning: "Module dependency cycle:
    # '_DarwinFoundation3.swiftmodule -> CxxStdlib.swiftinterface ->
    # _DarwinFoundation3.swiftmodule'" (verified 2026-08-06). Every other
    # target still caches; leave these two alone.
    #
    # Do NOT trust the xcode-build-benchmark "cached clean" leg here — it
    # reports ~65-75s and looks like caching is pure overhead. It is not:
    # COMPILATION_CACHE_CAS_PATH is *derived from* -derivedDataPath, so under
    # the script's temp DerivedData the CAS lands inside it and the leg's
    # rmtree(dd_path) deletes the cache it exists to measure, timing CAS
    # population instead. Its fast "clean" leg meanwhile uses shared
    # DerivedData with the real warm CAS, so the two legs are different
    # scenarios and the gap between them is virgin-DD cache misses.
    # Measured 2026-08-11, shared DerivedData + `xcodebuild clean`, same 1355
    # compile tasks: caching ON 20s, OFF 30s. Virgin DerivedData: ON 74s,
    # OFF 75s. Caching is a win in the realistic case and never a loss.
    # Benchmark this project with --no-cached-clean.
    # Shared App Group container ID. Used by the app/widget entitlements via
    # $(APP_GROUP_IDENTIFIER) and mirrored by the runtime constants
    # `AppGroup.identifier` in AmgiAppCore and AmgiTheme. Keep those in sync.
    #
    # iOS requires IDs to start with `group.` (Apple's signing server rejects
    # anything else). macOS's containermanagerd, however, only lets a sandboxed
    # process access a group container whose ID is prefixed with the requestor's
    # Team ID when the provisioning profile doesn't list the ID explicitly —
    # which is exactly why the widget extension was denied (its profile only
    # carries the `39557WW39R.*` wildcard) and fell back to the empty snapshot.
    # So the base ID is the iOS form, and the macOS SDK override switches to
    # the Team-ID-prefixed form (covered by that same wildcard).
    APP_GROUP_IDENTIFIER: group.com.bagumamartin.AmgiApp
    "APP_GROUP_IDENTIFIER[sdk=macosx*]": 39557WW39R.group.com.bagumamartin.AmgiApp
    DEVELOPMENT_TEAM: 39557WW39R
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
  configs:
    Debug:
      # Eager linking: let downstream targets link against generated stubs
      # before upstream linking completes, trimming the serial link tail of
      # this multi-module graph. Low-risk experiment — verify clean builds
      # still succeed and re-benchmark for the (small, uncertain) delta.
      EAGER_LINKING: YES
    Release:
      # Release-config hygiene only — NO effect on Debug iteration build time.
      GCC_OPTIMIZATION_LEVEL: s
      ONLY_ACTIVE_ARCH: NO
      ENABLE_TESTABILITY: NO
packages:
  AnkiBridge:
    path: ..
  AmgiUI:
    path: ../AmgiUI
  AmgiReader:
    path: ../AmgiReader
  AmgiFeatures:
    path: ../AmgiFeatures
  AmgiIcons:
    path: ../AmgiIcons
  AmgiEmbeddings:
    path: ../AmgiEmbeddings
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.0.0
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.0.0
  # amgi-mcp helper (embedded into the Mac app bundle)
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.0.0
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.0
schemes:
  AmgiApp:
    build:
      targets:
        AmgiApp: all
        AmgiWidget: all
    run:
      config: Debug
    test:
      config: Debug
      # Test plan, not `targets:` — xcodegen validates scheme test targets
      # against *project* targets, so the 10 SPM test targets in AnkiBridge /
      # AmgiFeatures / AmgiUI cannot be named here. A .xctestplan can reference
      # them (`container:../AmgiFeatures` + the target name as identifier),
      # which is what finally makes them run in CI instead of never at all.
      testPlans:
        - path: AmgiApp.xctestplan
          defaultPlan: true
  AmgiWatchApp:
    build:
      targets:
        AmgiWatchApp: all
    run:
      config: Debug
targets:
  AmgiApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        type: group
        excludes:
          - "Widgets"
          - "Watch"
      - path: Resources/MCEmojiPicker.bundle
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/mathjax
        type: folder
      - path: Resources/Review
        type: folder
      - path: Resources/Fonts
        type: folder
      - path: Resources/EPUBReader
        type: folder
    dependencies:
      - package: AmgiFeatures
        product: RootFeature
      - sdk: WidgetKit.framework
        destinationFilters: [iOS, macOS]
      - target: AmgiWidget
        embed: true
        destinationFilters: [iOS, macOS]
      - target: MCEmojiPicker
        destinationFilters: [iOS]
      - target: AmgiMCPHelper
        embed: false
        link: false
        destinationFilters: [macOS]
    postBuildScripts:
      # Embed the MCP helper into Contents/Helpers. Declared input/output
      # keeps this compatible with ENABLE_USER_SCRIPT_SANDBOXING; the
      # helper lives in BUILT_PRODUCTS_DIR for normal builds and
      # UNINSTALLED_PRODUCTS_DIR (or InstallationBuildProductsLocation)
      # for Archive (SKIP_INSTALL=YES).
      - name: Embed MCP Helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/amgi-mcp
          - $(UNINSTALLED_PRODUCTS_DIR)/amgi-mcp
          - $(UNINSTALLED_PRODUCTS_DIR)/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp
          - $(INSTALL_DIR)/amgi-mcp
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/amgi-mcp
        script: |
          set -e
          INPUT=""
          if [ -f "$BUILT_PRODUCTS_DIR/amgi-mcp" ]; then
            INPUT="$BUILT_PRODUCTS_DIR/amgi-mcp"
          elif [ -f "$UNINSTALLED_PRODUCTS_DIR/amgi-mcp" ]; then
            INPUT="$UNINSTALLED_PRODUCTS_DIR/amgi-mcp"
          elif [ -f "$UNINSTALLED_PRODUCTS_DIR/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp" ]; then
            INPUT="$UNINSTALLED_PRODUCTS_DIR/../InstallationBuildProductsLocation/usr/local/bin/amgi-mcp"
          elif [ -f "$INSTALL_DIR/amgi-mcp" ]; then
            INPUT="$INSTALL_DIR/amgi-mcp"
          else
            echo "amgi-mcp absent for this destination — skipping embed"
            exit 0
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          # Plain cp (not ditto): the user-script sandbox denies
          # ditto's temp-file + rename pattern inside the bundle.
          cp -p "$INPUT" "$SCRIPT_OUTPUT_FILE_0"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp
        CODE_SIGN_ENTITLEMENTS: AmgiApp.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AmgiApp-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cxx interop chain. Xcode + SPM under Swift 6 needs an explicit
        # Clang C++ standard alongside SWIFT_CXX_INTEROPERABILITY_MODE —
        # without the language-standard hint Clang's dependency scanner
        # rejects the CHoshiDicts modulemap's `requires cplusplus`.
        # The OTHER_SWIFT_FLAGS copy of the same switch looks redundant
        # but is required: the build setting alone doesn't reach the
        # dependency scanner (verified 2026-07: removing it fails with
        # "module 'CHoshiDicts' requires feature 'cplusplus'").
        #
        # NOTE (2026-08-15): these are NOT removable by moving Swift code.
        # No app source imports AmgiReaderDictionary any more — that all
        # lives in the ReaderFeature SPM target now — and a clean build
        # still fails without this block, because Xcode puts every package's
        # include dir on the app's -Xcc line, so the scanner walks
        # hoshidicts/include/module.modulemap no matter what any file
        # imports. Both the drop-everything and the keep-everything-but-
        # OTHER_SWIFT_FLAGS variants were tried and both fail. The app
        # target therefore stays out of explicit modules / compilation
        # caching as long as hoshidicts is anywhere in its package graph.
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_SWIFT_FLAGS: "$(inherited) -cxx-interoperability-mode=default"

  # Vendored izyumkin/MCEmojiPicker 1.2.5 (iOS-only upstream). Kept as its
  # own Swift 5 static-library target because the sources predate strict
  # concurrency and can't compile under the app's Swift 6 mode. The emoji
  # definition JSONs ship via Resources/MCEmojiPicker.bundle — the vendor's
  # CocoaPods-style Bundle.module shim locates them by that name.
  MCEmojiPicker:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/MCEmojiPicker
        excludes:
          - "Resources"
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: ""

  # MCP helper executable. Compiles Sources/AmgiMCP (shared with the
  # AnkiBridge package's `amgi-mcp` product) as a first-class Xcode
  # target so the app embeds it without external build steps.
  AmgiMCPHelper:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/AmgiMCP
        type: group
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AnkiProtoBridge
      - package: swift-sdk
        product: MCP
      - package: swift-log
        product: Logging
      - package: swift-protobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_NAME: amgi-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.helper
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        # Keep in lockstep with Package.swift's sharedSwiftSettings —
        # NonisolatedNonsendingByDefault changes async function-type
        # mangling across the package ↔ target link boundary.
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault"

  AmgiWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/Widgets
    dependencies:
      # Everything but @main AmgiWidgetBundle lives in WidgetFeature, which
      # brings AmgiAppCore + AmgiTheme transitively. AnkiKit was vestigial —
      # no widget source ever imported it.
      - package: AmgiFeatures
        product: WidgetFeature
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.widget
        INFOPLIST_FILE: Sources/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AmgiWidget.entitlements

  AmgiWatchApp:
    type: application
    platform: watchOS
    sources:
      # @main WatchApp.swift only — every watch screen lives in the
      # WatchFeature product below (same split as AmgiWidget/WidgetFeature).
      # Sources shared with iOS go through a product too: the review engine is
      # AmgiReviewCore, which used to be three Sources/Review files listed here
      # by path, compiling them into two targets as two distinct types (fixed
      # 2026-08-15). Do not re-add per-file paths here.
      - path: Sources/Watch
        type: group
    dependencies:
      - package: AnkiBridge
        product: AnkiKit
      - package: AmgiUI
        product: AmgiTheme
      - package: AmgiUI
        product: AmgiUI
      - package: AnkiBridge
        product: AnkiServices
      - package: AnkiBridge
        product: AnkiClients
      - package: AnkiBridge
        product: AnkiSync
      - package: AnkiBridge
        product: AnkiBackend
      - package: AnkiBridge
        product: AmgiCardWeb
      - package: AmgiFeatures
        product: AmgiAppCore
      - package: AmgiFeatures
        product: AmgiCharts
      - package: AmgiFeatures
        product: AmgiReviewCore
      - package: AmgiFeatures
        product: WatchFeature
      - package: swift-navigation
        product: SwiftNavigation
      - package: swift-sharing
        product: Sharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiApp.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.bagumamartin.AmgiApp

  AmgiAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/AmgiAppTests
    dependencies:
      - target: AmgiApp
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AmgiApp.app/AmgiApp
        # macOS apps nest the executable under Contents/MacOS; the iOS
        # layout above leaves TEST_HOST pointing at a nonexistent path and
        # `xcodebuild test -destination 'platform=macOS'` fails to launch.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/AmgiApp.app/Contents/MacOS/AmgiApp
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]":
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.bagumamartin.AmgiAppTests
        GENERATE_INFOPLIST_FILE: YES
        # Tests inherit @testable AmgiApp's transitive Cxx-mode import
        # of AmgiReaderDictionary, so they need the same Clang+Swift
        # interop flags as the app target (incl. the OTHER_SWIFT_FLAGS
        # copy — see the app target's comment).
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_SWIFT_FLAGS: "$(inherited) -cxx-interoperability-mode=default"
